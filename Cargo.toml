[package]
name = "hydrocomplete-dag"
version = "0.1.0"
edition = "2021"
description = "WASM model builder for HydroComplete — a visual hydrology/hydraulics DAG editor for stormwater analysis."
license = "MIT"
repository = "https://github.com/mf4633/hydrocomplete-dag"
homepage = "https://hydrocomplete.com"
keywords = ["wasm", "hydrology", "hydraulics", "stormwater", "civil-engineering"]
categories = ["wasm", "science", "visualization"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
